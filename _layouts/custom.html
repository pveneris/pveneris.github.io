<!doctype html>
<html lang="en">

<head>
  {% include head.html %}
</head>

<body>

  {% include masthead.html %}

  <div id="main" role="main">

    <div class="custom-page-content">
      {{ content }}
    </div>

  </div>

  {% include scripts.html %}

<script>
document.addEventListener("DOMContentLoaded", function () {

  const contentContainer = document.querySelector(".custom-page-content");

  async function loadPage(url, addToHistory = true) {

    try {

      const response = await fetch(url);

      if (!response.ok) {
        window.location.href = url;
        return;
      }

      const html = await response.text();

      const parser = new DOMParser();
      const newDocument = parser.parseFromString(html, "text/html");

      const newContent =
        newDocument.querySelector(".custom-page-content");

      if (!newContent) {
        window.location.href = url;
        return;
      }

      contentContainer.classList.add("content-changing");

      requestAnimationFrame(() => {

        contentContainer.innerHTML = newContent.innerHTML;

        if (addToHistory) {
          history.pushState({}, "", url);
        }

        updateActiveNavigation(url);

        requestAnimationFrame(() => {
          contentContainer.classList.remove("content-changing");
        });

      });

    }

    catch (error) {
      window.location.href = url;
    }

  }


  function updateActiveNavigation(url) {

    const links = document.querySelectorAll(".custom-nav a");

    links.forEach(link => {

      link.classList.remove("active");

      const href = link.getAttribute("href");

      if (!href) return;

      if (
        href !== "/files/Veneris_CV.pdf" &&
        (
          url === href ||
          (href !== "/" && url.startsWith(href))
        )
      ) {
        link.classList.add("active");
      }

      if (url === "/" && href === "/") {
        link.classList.add("active");
      }

    });

  }


  document.addEventListener("click", function (event) {

    const link = event.target.closest(".custom-nav a");

    if (!link) return;

    const href = link.getAttribute("href");

    if (!href) return;

    if (
      link.target === "_blank" ||
      href.endsWith(".pdf") ||
      href.startsWith("http")
    ) {
      return;
    }

    event.preventDefault();

    loadPage(href);

  });


  window.addEventListener("popstate", function () {
    loadPage(window.location.pathname, false);
  });

});
</script>
  
</body>

</html>
