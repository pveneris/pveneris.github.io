<!doctype html>
<html lang="en">

<head>
  {% include head.html %}
</head>

<body>

  {% include masthead.html %}

  <main class="custom-site-main">

    <div class="custom-page-content">
      {{ content }}
    </div>

  </main>

  {% include scripts.html %}

  <script>
  document.addEventListener("DOMContentLoaded", function () {

    const contentContainer =
      document.querySelector(".custom-page-content");


    /* ==================================================
       LOAD PAGE
       ================================================== */

    async function loadPage(url, addToHistory = true) {

      try {

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Could not load " + url);
        }

        const html = await response.text();

        const parser = new DOMParser();

        const newDocument =
          parser.parseFromString(html, "text/html");

        const newContent =
          newDocument.querySelector(".custom-page-content");

        if (!newContent) {
          throw new Error("Page content not found");
        }

        contentContainer.classList.add("content-changing");

        requestAnimationFrame(function () {

          contentContainer.innerHTML =
            newContent.innerHTML;

          if (addToHistory) {
            history.pushState({}, "", url);
          }

          updateActiveNavigation(url);

          requestAnimationFrame(function () {

            contentContainer.classList.remove(
              "content-changing"
            );

          });

        });

      }

      catch (error) {

        window.location.href = url;

      }

    }


    /* ==================================================
       ACTIVE NAVIGATION
       ================================================== */

    function updateActiveNavigation(url) {

      const links =
        document.querySelectorAll(".custom-nav a");

      links.forEach(function (link) {

        link.classList.remove("active");

        const href =
          link.getAttribute("href");

        if (!href) return;

        if (
          url === href ||
          (
            href !== "/" &&
            url.startsWith(href)
          )
        ) {
          link.classList.add("active");
        }

        if (
          url === "/" &&
          href === "/"
        ) {
          link.classList.add("active");
        }

      });

    }


    /* ==================================================
       ABSTRACT BUTTON
       ================================================== */

    document.addEventListener("click", function (event) {

      const button =
        event.target.closest(".abstract-button");

      if (!button) return;

      const paper =
        button.closest(".paper-item");

      if (!paper) return;

      const abstract =
        paper.querySelector(".paper-abstract");

      if (!abstract) return;

      const isHidden =
        abstract.hasAttribute("hidden");

      if (isHidden) {

        abstract.removeAttribute("hidden");

        button.setAttribute(
          "aria-expanded",
          "true"
        );

      }

      else {

        abstract.setAttribute(
          "hidden",
          ""
        );

        button.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    });


    /* ==================================================
       NAVIGATION
       ================================================== */

    document.addEventListener("click", function (event) {

      const link =
        event.target.closest(".custom-nav a");

      if (!link) return;

      const href =
        link.getAttribute("href");

      if (!href) return;

      /*
       * Allow PDFs, external links and links opening
       * in a new tab to behave normally.
       */

      if (
        link.target === "_blank" ||
        href.endsWith(".pdf") ||
        href.startsWith("http")
      ) {
        return;
      }

      event.preventDefault();

      loadPage(href);

    });


    /* ==================================================
       BROWSER BACK / FORWARD
       ================================================== */

    window.addEventListener("popstate", function () {

      loadPage(
        window.location.pathname,
        false
      );

    });

  });
  </script>

</body>

</html>
