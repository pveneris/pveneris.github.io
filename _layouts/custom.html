<!doctype html>
<html lang="en">

<head>
  {% include head.html %}
</head>

<body>

  {% include masthead.html %}

  <main class="custom-site-main">

    <div class="custom-page-content">
      {{ content }}
    </div>

  </main>

  {% include scripts.html %}

  <script>
  document.addEventListener("DOMContentLoaded", function () {

    const contentContainer =
      document.querySelector(".custom-page-content");

    const pageCache = new Map();


    /* ==================================================
       PAGE CACHE
       ================================================== */

    async function getPage(url) {

      if (pageCache.has(url)) {
        return pageCache.get(url);
      }

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Could not load " + url);
      }

      const html = await response.text();

      const parser = new DOMParser();

      const newDocument =
        parser.parseFromString(html, "text/html");

      const newContent =
        newDocument.querySelector(".custom-page-content");

      if (!newContent) {
        throw new Error("Page content not found");
      }

      const contentHTML = newContent.innerHTML;

      pageCache.set(url, contentHTML);

      return contentHTML;
    }


    /* ==================================================
       SMOOTH PAGE LOADING
       ================================================== */

    async function loadPage(url, addToHistory = true) {

      try {

        const newHTML = await getPage(url);

        contentContainer.classList.add("content-changing");

        requestAnimationFrame(function () {

          contentContainer.innerHTML = newHTML;

          if (addToHistory) {
            history.pushState({}, "", url);
          }

          updateActiveNavigation(url);

          requestAnimationFrame(function () {
            contentContainer.classList.remove("content-changing");
          });

        });

      }

      catch (error) {
        window.location.href = url;
      }

    }


    /* ==================================================
       ACTIVE NAVIGATION
       ================================================== */

    function updateActiveNavigation(url) {

      const links =
        document.querySelectorAll(".custom-nav a");

      links.forEach(function (link) {

        link.classList.remove("active");

        const href = link.getAttribute("href");

        if (!href) return;

        if (href === "/files/Veneris_CV.pdf") {
          return;
        }

        if (
          url === href ||
          (
            href !== "/" &&
            url.startsWith(href)
          )
        ) {
          link.classList.add("active");
        }

        if (url === "/" && href === "/") {
          link.classList.add("active");
        }

      });

    }


    /* ==================================================
       ABSTRACT BUTTONS
       ================================================== */

    document.addEventListener("click", function (event) {

      const button =
        event.target.closest(".abstract-button");

      if (!button) return;

      const paper =
        button.closest(".paper-item");

      if (!paper) return;

      const abstract =
        paper.querySelector(".paper-abstract");

      if (!abstract) return;

      const opening = abstract.hidden;

      abstract.hidden = !opening;

      button.setAttribute(
        "aria-expanded",
        opening ? "true" : "false"
      );

    });


    /* ==================================================
       NAVIGATION CLICKS
       ================================================== */

    document.addEventListener("click", function (event) {

      const link =
        event.target.closest(".custom-nav a");

      if (!link) return;

      const href = link.getAttribute("href");

      if (!href) return;

      if (
        link.target === "_blank" ||
        href.endsWith(".pdf") ||
        href.startsWith("http")
      ) {
        return;
      }

      event.preventDefault();

      loadPage(href);

    });


    /* ==================================================
       BROWSER BACK / FORWARD
       ================================================== */

    window.addEventListener("popstate", function () {

      loadPage(
        window.location.pathname,
        false
      );

    });


    /* ==================================================
       PRELOAD PAGES
       ================================================== */

    const pagesToPreload = [
      "/",
      "/research/",
      "/publications/",
      "/vitae/"
    ];

    pagesToPreload.forEach(function (url) {

      if (url !== window.location.pathname) {

        getPage(url).catch(function () {
          /* Ignore preload failures */
        });

      }

    });

  });
  </script>

</body>

</html>
